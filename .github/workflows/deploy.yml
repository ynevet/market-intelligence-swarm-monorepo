name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
    paths:
      # Server source code and dependencies
      - 'server/**/*.py'
      - 'server/requirements.txt'
      - 'server/Dockerfile'
      # Client source code and dependencies
      - 'client/src/**'
      - 'client/public/**'
      - 'client/Dockerfile'
      - 'client/package.json'
      - 'client/package-lock.json'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            server:
              - 'server/**/*.py'
              - 'server/requirements.txt'
              - 'server/Dockerfile'
            client:
              - 'client/src/**'
              - 'client/public/**'
              - 'client/Dockerfile'
              - 'client/package.json'
              - 'client/package-lock.json'

  deploy:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.client == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install EB CLI
        run: |
          pip install awsebcli --upgrade

      - name: Initialize and Deploy Server
        if: needs.detect-changes.outputs.server == 'true'
        working-directory: ./server
        run: |
          echo "Pulling EB configuration for server..."
          eb init mis-app-api --region us-east-1 --platform "Docker running on 64bit Amazon Linux 2023" --non-interactive
          echo "Deploying server to mis-app-api-dev..."
          eb deploy mis-app-api-dev --timeout 20
          echo "✓ Server deployment completed"

      - name: Initialize and Deploy Client
        if: needs.detect-changes.outputs.client == 'true'
        working-directory: ./client
        run: |
          echo "Pulling EB configuration for client..."
          eb init mis-app-ui --region us-east-1 --platform "Docker running on 64bit Amazon Linux 2023" --non-interactive
          echo "Deploying client to mis-app-ui-dev..."
          eb deploy mis-app-ui-dev --timeout 20
          echo "✓ Client deployment completed"

