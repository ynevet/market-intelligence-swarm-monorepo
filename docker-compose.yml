services:
  server:
    build:
      context: ./server
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--worker-class", "gthread", "--workers", "2", "--threads", "8", "--timeout", "0", "application:application"]
    ports:
      - "5000:5000"
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MONGO_URI: ${MONGO_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-}
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./server/requirements.txt
        - action: rebuild
          path: ./server
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
            - README.md

  client:
    build:
      context: ./client
      target: development
    ports:
      - "5173:5173"
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:5000}
    depends_on:
      - server
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./client/src
          target: /app/src
        - action: sync
          path: ./client/public
          target: /app/public
        - action: rebuild
          path: ./client/package.json
        - action: rebuild
          path: ./client/package-lock.json